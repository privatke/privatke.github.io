<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Приветка — гои на любой вкус</title>
  <meta name="description" content="Гои на любой вкус. Оставьте заявку или выберите комплектацию — оплата в Telegram.">
  <meta name="theme-color" content="#f2f0e9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f2f0e9'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23e01b24' stroke-width='5'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='30' font-weight='900' fill='%23131210'%3E%D0%93%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f2f0e9;
      --ink: #131210;
      --red: #e01b24;
      --red-dark: #b3131b;
      --muted: #6d6a61;
      --line: 2px solid var(--ink);
      --font-display: "Unbounded", "Arial Black", Impact, sans-serif;
      --font-body: "Golos Text", "Segoe UI", Arial, sans-serif;
      --page: min(1240px, calc(100% - 48px));
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background-color: var(--paper);
      background-image: radial-gradient(rgba(19, 18, 16, 0.11) 1px, transparent 1px);
      background-size: 18px 18px;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    .page {
      width: var(--page);
      margin-inline: auto;
    }

    /* ---------- Header ---------- */

    .site-header {
      border-bottom: var(--line);
      background: rgba(242, 240, 233, 0.92);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 68px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand__mark {
      width: 14px;
      height: 14px;
      background: var(--red);
      border-radius: 50%;
      flex: none;
    }

    .header-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    /* ---------- Hero ---------- */

    .hero {
      padding: clamp(36px, 7vw, 92px) 0 clamp(44px, 7vw, 96px);
      border-bottom: var(--line);
      overflow: clip;
    }

    .hero__intro {
      margin-bottom: clamp(36px, 6vw, 72px);
    }

    .hero__title {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.45rem, 7.2vw, 6.4rem);
      line-height: 0.98;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      max-width: 13ch;
    }

    .hero__title .title-line {
      display: block;
      overflow: hidden;
    }

    .hero__title .title-line > span {
      display: block;
      animation: title-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .hero__title .title-line:nth-child(2) > span {
      animation-delay: 0.08s;
    }

    .hero__cta-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 0 4px;
    }

    .circle-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(760px, 100%);
      aspect-ratio: 1;
      max-width: 100%;
    }

    .hand-circle {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 0;
      transform: rotate(-1.5deg);
    }

    .hand-circle path {
      fill: none;
      stroke: var(--red);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw-circle 1.35s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }

    .cta-button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(78%, 620px);
      min-height: clamp(96px, 15vw, 168px);
      padding: clamp(26px, 4.6vw, 52px) clamp(24px, 4vw, 52px);
      background: var(--ink);
      color: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 0;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(1.45rem, 4.6vw, 3.7rem);
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      transition: transform 0.18s ease, background-color 0.18s ease, color 0.18s ease;
      animation: cta-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }

    .cta-button:hover {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      transform: translateY(-4px) rotate(-0.6deg);
    }

    .cta-button:active {
      transform: translateY(0) scale(0.99);
    }

    /* ---------- Catalog ---------- */

    .catalog {
      padding: clamp(42px, 7vw, 88px) 0 clamp(56px, 8vw, 104px);
    }

    .catalog__head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: clamp(26px, 4vw, 44px);
    }

    .catalog__title {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.9rem, 4.4vw, 3.4rem);
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .catalog__note {
      margin: 0 0 6px;
      font-size: 14px;
      color: var(--muted);
      text-align: right;
    }

    .lots {
      border-top: var(--line);
    }

    .lot {
      display: grid;
      grid-template-columns: minmax(120px, 0.6fr) minmax(0, 1.5fr) minmax(130px, 0.7fr) auto;
      align-items: center;
      gap: clamp(16px, 3vw, 44px);
      padding: clamp(16px, 2.2vw, 26px) clamp(8px, 1.4vw, 18px);
      border-bottom: var(--line);
      color: var(--ink);
      text-decoration: none;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    .lot__price {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.9rem, 3.4vw, 3rem);
      line-height: 1;
      letter-spacing: -0.03em;
      white-space: nowrap;
      color: var(--red);
    }

    .lot__name {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.05rem, 1.7vw, 1.45rem);
      line-height: 1.1;
      letter-spacing: -0.015em;
    }

    .lot__art {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--red);
    }

    .lot__art span {
      display: block;
      width: 24px;
      height: 24px;
      border: 3px solid currentColor;
    }

    .lot__art span:nth-child(2) {
      transform: translateY(8px);
    }

    .lot__art span:nth-child(3) {
      transform: translateY(-4px);
    }

    .lot__art span:nth-child(4) {
      transform: translateY(10px);
    }

    .lot__buy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 132px;
      min-height: 48px;
      padding: 0 20px;
      border: var(--line);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    @media (hover: hover) {
      .lot:hover {
        background: var(--ink);
        color: var(--paper);
      }

      .lot:hover .lot__buy {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
    }

    .lot:focus-visible {
      outline: 4px solid var(--red);
      outline-offset: 4px;
    }

    /* ---------- Focus & motion ---------- */

    a:focus-visible {
      outline: 4px solid var(--red);
      outline-offset: 4px;
    }

    @keyframes draw-circle {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes title-in {
      from {
        transform: translateY(110%);
      }
      to {
        transform: translateY(0);
      }
    }

    @keyframes cta-in {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 860px) {
      .hero__title {
        max-width: none;
      }

      .lot {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "price buy"
          "name buy"
          "art buy";
        gap: 4px 16px;
        padding: 18px 8px;
      }

      .lot__price {
        grid-area: price;
      }

      .lot__name {
        grid-area: name;
      }

      .lot__art {
        grid-area: art;
        padding-top: 6px;
      }

      .lot__buy {
        grid-area: buy;
        align-self: center;
        min-width: 112px;
        padding-inline: 14px;
      }

      .lot__art span {
        width: 20px;
        height: 20px;
      }
    }

    @media (max-width: 560px) {
      :root {
        --page: calc(100% - 32px);
      }

      .site-header__inner {
        min-height: 58px;
      }

      .header-note {
        display: none;
      }

      .hero__cta-area {
        padding-top: 4px;
      }

      .circle-wrap {
        width: 100%;
      }

      .cta-button {
        width: 74%;
        padding-inline: 10px;
        font-size: clamp(1.05rem, 7vw, 2rem);
      }

      .hand-circle path {
        stroke-width: 5;
      }

      .catalog__head {
        flex-direction: column;
        align-items: flex-start;
      }

      .catalog__note {
        text-align: left;
      }
    }

    @media (max-width: 380px) {
      .lot__price {
        font-size: 1.65rem;
      }

      .lot__name {
        font-size: 0.92rem;
      }

      .lot__buy {
        min-width: 96px;
        padding-inline: 8px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }

      .hand-circle path {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="page site-header__inner">
      <a class="brand" href="#top">
        <span class="brand__mark" aria-hidden="true"></span>
        Приветка
      </a>
      <p class="header-note">Приём заявок открыт</p>
    </div>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="page">
        <div class="hero__intro">
          <h1 class="hero__title" id="hero-title">
            <span class="title-line"><span>Гои на</span></span>
            <span class="title-line"><span>любой вкус</span></span>
          </h1>
        </div>

        <div class="hero__cta-area">
          <div class="circle-wrap">
            <svg class="hand-circle" viewBox="0 0 1000 1000" aria-hidden="true" focusable="false">
              <path pathLength="1" d="M 508 54 C 752 46 950 232 948 500 C 946 764 754 948 504 944 C 250 940 56 752 58 498 C 60 246 248 60 514 58 C 592 58 662 72 724 98" />
            </svg>
            <a class="cta-button" href="https://docs.google.com/forms/d/e/1FAIpQLSfOJdr3Usvls7B8Tr48eUqSFnzom-wWudJK_s5jockAasJzmw/viewform?usp=publish-editor" target="_blank" rel="noopener">
              Подать заявку
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="page">
        <div class="catalog__head">
          <h2 class="catalog__title" id="catalog-title">Каталог</h2>
          <p class="catalog__note">Оплата в Telegram</p>
        </div>

        <div class="lots">
          <a class="lot" href="https://t.me/tribute/app?startapp=s16Rk" target="_blank" rel="noopener" aria-label="Купить «Гой стандартный» за 100 рублей">
            <p class="lot__price">100 ₽</p>
            <h3 class="lot__name">Гой стандартный</h3>
            <div class="lot__art" aria-hidden="true">
              <span></span>
            </div>
            <span class="lot__buy">Купить</span>
          </a>

          <a class="lot" href="https://t.me/tribute/app?startapp=s16Rl" target="_blank" rel="noopener" aria-label="Купить «Гой побольбше» за 300 рублей">
            <p class="lot__price">300 ₽</p>
            <h3 class="lot__name">Гой побольбше</h3>
            <div class="lot__art" aria-hidden="true">
              <span></span>
              <span></span>
            </div>
            <span class="lot__buy">Купить</span>
          </a>

          <a class="lot" href="https://t.me/tribute/app?startapp=s16Ro" target="_blank" rel="noopener" aria-label="Купить «Гой в квадрате» за 1000 рублей">
            <p class="lot__price">1000 ₽</p>
            <h3 class="lot__name">Гой в квадрате</h3>
            <div class="lot__art" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <span class="lot__buy">Купить</span>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
